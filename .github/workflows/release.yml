name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'com.iSoldLeo.Mio' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app (arm64)
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [[ -n "${APP_BUNDLE_ID}" ]]; then
            EXTRA_ARGS+=("PRODUCT_BUNDLE_IDENTIFIER=${APP_BUNDLE_ID}")
          fi

          xcodebuild \
            -project Mio.xcodeproj \
            -scheme Mio \
            -configuration Release \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=build/Release-arm64 \
            CODE_SIGNING_ALLOWED=NO \
            "${EXTRA_ARGS[@]}"

      - name: Package zip
        run: |
          VERSION_TAG="${GITHUB_REF_NAME}"
          APP_PATH="build/Release-arm64/Mio.app"
          ZIP_NAME="Mio-${VERSION_TAG}-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          shasum -a 256 "$ZIP_NAME" > "${ZIP_NAME}.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Mio-*-macOS-arm64.zip
            Mio-*-macOS-arm64.zip.sha256
          generate_release_notes: true
