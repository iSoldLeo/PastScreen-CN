name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode signing certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
        run: echo "$P12_BASE64" | base64 --decode > dev.p12

      - name: Import certificate into temp keychain
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import dev.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

      - name: Build app (arm64)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Mio.xcodeproj \
            -scheme Mio \
            -configuration Release \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=build/Release-arm64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development"

      - name: Install create-dmg
        shell: bash
        run: brew install create-dmg

      - name: Build DMG
        shell: bash
        run: |
          set -euo pipefail
          VERSION_TAG="${GITHUB_REF_NAME}"
          APP_PATH="build/Release-arm64/Mio.app"
          DMG_NAME="Mio-${VERSION_TAG}-macOS-arm64.dmg"

          # Stage only the app so create-dmg's source folder stays clean.
          STAGE_DIR="dmg-stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          cp -R "$APP_PATH" "$STAGE_DIR/"

          create-dmg \
            --volname "Mio" \
            --background "assets/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --text-size 13 \
            --icon "Mio.app" 170 200 \
            --hide-extension "Mio.app" \
            --app-drop-link 430 200 \
            --no-internet-enable \
            "$DMG_NAME" \
            "$STAGE_DIR"

          shasum -a 256 "$DMG_NAME" > "${DMG_NAME}.sha256"

      - name: Build zip (fallback for power users)
        shell: bash
        run: |
          set -euo pipefail
          VERSION_TAG="${GITHUB_REF_NAME}"
          APP_PATH="build/Release-arm64/Mio.app"
          ZIP_NAME="Mio-${VERSION_TAG}-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          shasum -a 256 "$ZIP_NAME" > "${ZIP_NAME}.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Mio-*-macOS-arm64.dmg
            Mio-*-macOS-arm64.dmg.sha256
            Mio-*-macOS-arm64.zip
            Mio-*-macOS-arm64.zip.sha256
          generate_release_notes: true
